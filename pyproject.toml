[project]
name = "mcpqaauto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jagdhakshi80", email = "jagdhakshi.a@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mcp<2",
    "pydantic>=2.14.3",
]

[project.scripts]
mcpqaauto = "mcpqaauto:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
]
